                        <body>
                            <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Client-Side Caption Generator</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    margin: 0;
    padding: 20px;
    background: #fafafa;
    color: #222;
  }
  h1 { font-size: 20px; margin-bottom: 15px; }
  h3 { margin: 10px 0 6px; font-size: 14px; color: #444; text-transform: uppercase; letter-spacing: 0.5px; }

  .layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    align-items: start;
  }
  .left-col, .right-col {
    background: white;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 16px;
  }
  .right-col {
    max-height: 90vh;
    overflow-y: auto;
    position: sticky;
    top: 20px;
  }

  video { width: 100%; background: #000; border-radius: 6px; }
  #overlay { position: relative; }
  #captionOverlay {
    position: absolute; bottom: 20px; left: 0; right: 0;
    text-align: center; color: white; font-size: 20px;
    text-shadow: 1px 1px 3px black, -1px -1px 3px black;
    pointer-events: none;
  }

  #status { font-size: 13px; color: #666; margin: 10px 0; min-height: 18px; }

  .script-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .charLimitControl {
    font-size: 12px;
    color: #555;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .charLimitControl input {
    width: 60px;
    padding: 3px 6px;
    font-size: 12px;
  }

  .editor-wrapper {
    position: relative;
    width: 100%;
    height: 160px;
    margin-top: 6px;
  }
  .editor-backdrop, #scriptInput {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    width: 100%; height: 100%;
    margin: 0;
    padding: 8px;
    font-family: monospace;
    font-size: 13.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow: auto;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  .editor-backdrop {
    color: transparent;
    z-index: 1;
    pointer-events: none;
    background: white;
  }
  #scriptInput {
    z-index: 2;
    background: transparent;
    color: #222;
    resize: vertical;
  }
  .line-over { background-color: #ffe08a; }

  .toolbar { margin: 10px 0; display: flex; gap: 8px; flex-wrap: wrap; }
  .toolbar button {
    padding: 6px 12px; cursor: pointer; border: 1px solid #ccc;
    background: #f5f5f5; border-radius: 4px; font-size: 13px;
  }
  .toolbar button:hover { background: #eaeaea; }
  .toolbar button:disabled { opacity: 0.5; cursor: not-allowed; }

  .caption-row {
    border: 1px solid #e5e5e5;
    border-radius: 6px;
    padding: 8px;
    margin-bottom: 8px;
    background: #fcfcfc;
  }
  .caption-row.overlap {
    border-color: #d9534f;
    background: #fff2f2;
  }
  .overlapWarning {
    font-size: 11px;
    color: #d9534f;
    font-weight: bold;
    margin-bottom: 4px;
  }
  .caption-row .row-top {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-bottom: 6px;
  }
  .caption-row input[type="text"].timeField {
    width: 85px; font-family: monospace; font-size: 12px; padding: 4px;
  }
  .caption-row textarea.textField {
    width: 100%;
    display: block;
    font-size: 13px;
    padding: 6px;
    font-family: inherit;
    resize: vertical;
    min-height: 50px;
    margin-bottom: 4px;
  }
  .caption-row .row-actions {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .caption-row .row-actions button {
    font-size: 11px;
    padding: 3px 7px;
    cursor: pointer;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #fff;
  }
  .caption-row .row-actions button:hover { background: #f0f0f0; }
  .charCount { font-size: 11px; color: #888; margin-left: 2px; }
  .charCount.over { color: #d9534f; font-weight: bold; }
</style>
</head>
<body>

<h1>Client-Side Caption Generator</h1>

<div class="layout">

  <div class="left-col">
    <h3>Video</h3>
    <input type="file" id="fileInput" accept="audio/*,video/*" />
    <div id="overlay">
      <video id="videoPreview" controls style="display:none;"></video>
      <div id="captionOverlay"></div>
    </div>
    <div id="status">Idle. Upload a file to begin.</div>

    <div class="toolbar">
      <button id="transcribeBtn">1. Transcribe Audio</button>
      <button id="alignBtn" disabled>2. Align Script to Audio</button>
    </div>

    <div class="script-header">
      <h3 style="margin:0;">Script (one caption per line)</h3>
      <div class="charLimitControl">
        <label for="charLimitInput">Character limit:</label>
        <input type="number" id="charLimitInput" value="100" min="10" />
      </div>
    </div>
    <p style="font-size:12px; color:#888; margin:4px 0;">
      Lines highlighted in yellow exceed the character limit above — consider breaking them into multiple lines for readability.
    </p>
    <div class="editor-wrapper">
      <div class="editor-backdrop" id="scriptBackdrop"></div>
      <textarea id="scriptInput" placeholder="Paste your narration script here, one caption per line..." spellcheck="false"></textarea>
    </div>
  </div>

  <div class="right-col">
    <h3>Captions</h3>
    <div class="toolbar">
      <button id="addRowBtn">+ Add Line</button>
      <button id="exportSrtBtn">Export SRT</button>
      <button id="exportVttBtn">Export VTT</button>
    </div>
    <div id="captionList"></div>
  </div>

</div>

<script type="module">
import { pipeline } from "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2";

// --- Defensive: strip any accidental beforeunload handlers ---
window.onbeforeunload = null;
window.addEventListener("beforeunload", (e) => {
  delete e["returnValue"];
}, { capture: true });

// ---------- State ----------
let transcriber = null;
let whisperWords = [];
let captions = [];
let videoFile = null;
let CHAR_LIMIT = 100;

const fileInput = document.getElementById("fileInput");
const statusEl = document.getElementById("status");
const videoPreview = document.getElementById("videoPreview");
const captionOverlay = document.getElementById("captionOverlay");
const scriptInput = document.getElementById("scriptInput");
const scriptBackdrop = document.getElementById("scriptBackdrop");
const transcribeBtn = document.getElementById("transcribeBtn");
const alignBtn = document.getElementById("alignBtn");
const captionList = document.getElementById("captionList");
const addRowBtn = document.getElementById("addRowBtn");
const exportSrtBtn = document.getElementById("exportSrtBtn");
const exportVttBtn = document.getElementById("exportVttBtn");
const charLimitInput = document.getElementById("charLimitInput");

// ---------- Character limit control ----------
charLimitInput.addEventListener("input", () => {
  const v = parseInt(charLimitInput.value, 10);
  if (!isNaN(v) && v > 0) {
    CHAR_LIMIT = v;
    updateBackdrop();
    renderCaptionList();
  }
});

// ---------- Script highlighting (configurable char limit) ----------
function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function updateBackdrop() {
  const lines = scriptInput.value.split("\n");
  const html = lines.map(line => {
    const escaped = escapeHtml(line) || " ";
    if (line.length > CHAR_LIMIT) {
      return `<span class="line-over">${escaped}</span>`;
    }
    return escaped;
  }).join("\n");
  scriptBackdrop.innerHTML = html;
}

scriptInput.addEventListener("input", updateBackdrop);
scriptInput.addEventListener("scroll", () => {
  scriptBackdrop.scrollTop = scriptInput.scrollTop;
  scriptBackdrop.scrollLeft = scriptInput.scrollLeft;
});

// ---------- File handling ----------
fileInput.addEventListener("change", (e) => {
  videoFile = e.target.files[0];
  if (!videoFile) return;
  videoPreview.src = URL.createObjectURL(videoFile);
  videoPreview.style.display = "block";
  alignBtn.disabled = true;
  whisperWords = [];
  statusEl.textContent = "File loaded. Click 'Transcribe Audio' when ready.";
});

// ---------- Audio decode ----------
async function decodeAudioToFloat32(arrayBuffer) {
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

  const numChannels = audioBuffer.numberOfChannels;
  const length = audioBuffer.length;
  const monoData = new Float32Array(length);
  for (let ch = 0; ch < numChannels; ch++) {
    const channelData = audioBuffer.getChannelData(ch);
    for (let i = 0; i < length; i++) {
      monoData[i] += channelData[i] / numChannels;
    }
  }

  const targetSampleRate = 16000;
  const offlineCtx = new OfflineAudioContext(
    1,
    Math.ceil(length * targetSampleRate / audioBuffer.sampleRate),
    targetSampleRate
  );
  const bufferSource = offlineCtx.createBufferSource();
  const monoBuffer = offlineCtx.createBuffer(1, length, audioBuffer.sampleRate);
  monoBuffer.copyToChannel(monoData, 0);
  bufferSource.buffer = monoBuffer;
  bufferSource.connect(offlineCtx.destination);
  bufferSource.start(0);

  const resampledBuffer = await offlineCtx.startRendering();
  return resampledBuffer.getChannelData(0);
}

// ---------- Milestone 1: Transcription ----------
async function loadModel() {
  statusEl.textContent = "Loading Whisper-tiny model...";
  try {
    transcriber = await pipeline("automatic-speech-recognition", "Xenova/whisper-tiny", { device: "webgpu" });
    statusEl.textContent = "Model loaded (WebGPU).";
  } catch (e) {
    console.warn("WebGPU unavailable, falling back to WASM:", e);
    transcriber = await pipeline("automatic-speech-recognition", "Xenova/whisper-tiny");
    statusEl.textContent = "Model loaded (WASM fallback).";
  }
}

transcribeBtn.addEventListener("click", async () => {
  if (!videoFile) { alert("Upload a file first."); return; }
  if (!transcriber) await loadModel();

  statusEl.textContent = "Decoding audio...";
  const arrayBuffer = await videoFile.arrayBuffer();
  const audioData = await decodeAudioToFloat32(arrayBuffer);

  statusEl.textContent = "Running Whisper inference...";
  try {
    const result = await transcriber(audioData, {
      return_timestamps: "word",
      chunk_length_s: 30,
      stride_length_s: 5,
    });

    whisperWords = (result.chunks || []).map(c => ({
      text: c.text.trim(),
      start: c.timestamp[0],
      end: c.timestamp[1] ?? c.timestamp[0] + 0.3,
    })).filter(w => w.text.length > 0);

    statusEl.textContent = `Transcription done. ${whisperWords.length} words detected. Paste your script, then click Align.`;
    alignBtn.disabled = false;
  } catch (err) {
    console.error(err);
    statusEl.textContent = "Error during transcription. Check console.";
  }
});

// ---------- Milestone 2: Alignment ----------
function normalize(w) {
  return w.toLowerCase().replace(/[^a-z0-9']/g, "");
}

function alignSequences(a, b) {
  const MATCH = 2, MISMATCH = -1, GAP = -1;
  const n = a.length, m = b.length;
  const score = Array.from({ length: n + 1 }, () => new Float32Array(m + 1));
  const trace = Array.from({ length: n + 1 }, () => new Uint8Array(m + 1));

  for (let i = 0; i <= n; i++) { score[i][0] = i * GAP; trace[i][0] = 1; }
  for (let j = 0; j <= m; j++) { score[0][j] = j * GAP; trace[0][j] = 2; }

  for (let i = 1; i <= n; i++) {
    for (let j = 1; j <= m; j++) {
      const matchScore = (a[i - 1] === b[j - 1]) ? MATCH : MISMATCH;
      const diag = score[i - 1][j - 1] + matchScore;
      const up = score[i - 1][j] + GAP;
      const left = score[i][j - 1] + GAP;
      let best = diag, dir = 0;
      if (up > best) { best = up; dir = 1; }
      if (left > best) { best = left; dir = 2; }
      score[i][j] = best;
      trace[i][j] = dir;
    }
  }

  const pairs = [];
  let i = n, j = m;
  while (i > 0 && j > 0) {
    const dir = trace[i][j];
    if (dir === 0) {
      if (a[i - 1] === b[j - 1]) pairs.push({ aIdx: i - 1, bIdx: j - 1 });
      i--; j--;
    } else if (dir === 1) { i--; }
    else { j--; }
  }
  pairs.reverse();
  return pairs;
}

function buildCaptionsFromScript(scriptText) {
  const lines = scriptText.split("\n").map(l => l.trim()).filter(l => l.length > 0);

  const scriptWordsFlat = [];
  lines.forEach((line, lineIdx) => {
    line.split(/\s+/).forEach(w => scriptWordsFlat.push({ text: w, lineIdx }));
  });

  const aNorm = whisperWords.map(w => normalize(w.text));
  const bNorm = scriptWordsFlat.map(w => normalize(w.text));

  const pairs = alignSequences(aNorm, bNorm);

  const scriptTimestamps = new Array(scriptWordsFlat.length).fill(null);
  pairs.forEach(({ aIdx, bIdx }) => {
    scriptTimestamps[bIdx] = { start: whisperWords[aIdx].start, end: whisperWords[aIdx].end };
  });

  const lineBounds = lines.map(() => ({ start: null, end: null }));
  scriptWordsFlat.forEach((w, idx) => {
    const ts = scriptTimestamps[idx];
    if (!ts) return;
    const bound = lineBounds[w.lineIdx];
    if (bound.start === null || ts.start < bound.start) bound.start = ts.start;
    if (bound.end === null || ts.end > bound.end) bound.end = ts.end;
  });

  for (let i = 0; i < lineBounds.length; i++) {
    if (lineBounds[i].start === null) {
      let prevEnd = 0;
      for (let p = i - 1; p >= 0; p--) {
        if (lineBounds[p].end !== null) { prevEnd = lineBounds[p].end; break; }
      }
      let nextStart = prevEnd + 1;
      for (let n = i + 1; n < lineBounds.length; n++) {
        if (lineBounds[n].start !== null) { nextStart = lineBounds[n].start; break; }
      }
      lineBounds[i].start = prevEnd;
      lineBounds[i].end = Math.max(prevEnd + 1, nextStart);
    }
  }

  // --- Remove gaps between captions ---
  // Each caption's start = previous caption's end.
  // The very first caption's start = the actual time the first word is spoken.
  for (let i = 1; i < lineBounds.length; i++) {
    lineBounds[i].start = lineBounds[i - 1].end;
    if (lineBounds[i].end < lineBounds[i].start) {
      lineBounds[i].end = lineBounds[i].start + 0.5;
    }
  }

  captions = lines.map((text, idx) => ({
    id: crypto.randomUUID(),
    start: lineBounds[idx].start,
    end: lineBounds[idx].end,
    text,
    _cursorPos: null,
  }));

  renderCaptionList();
}

alignBtn.addEventListener("click", () => {
  const scriptText = scriptInput.value;
  if (!scriptText.trim()) { alert("Paste your script first."); return; }
  if (whisperWords.length === 0) { alert("Transcribe audio first."); return; }
  statusEl.textContent = "Aligning script to audio timing...";
  buildCaptionsFromScript(scriptText);
  statusEl.textContent = `Alignment done. ${captions.length} caption lines generated. Edit on the right as needed.`;
});

// ---------- Milestone 3: Editable UI ----------
function formatTime(sec) {
  if (sec === null || isNaN(sec)) return "00:00.000";
  const m = Math.floor(sec / 60);
  const s = (sec % 60).toFixed(3).padStart(6, "0");
  return `${String(m).padStart(2, "0")}:${s}`;
}

function parseTime(str) {
  const match = str.match(/^(\d+):(\d+(?:\.\d+)?)$/);
  if (!match) return null;
  return parseInt(match[1]) * 60 + parseFloat(match[2]);
}

function captionsOverlap(a, b) {
  return a.start < b.end - 0.001 && b.start < a.end - 0.001;
}

function renderCaptionList() {
  captionList.innerHTML = "";
  captions.forEach((cap, idx) => {
    const row = document.createElement("div");
    row.className = "caption-row";

    // Overlap detection against previous and next captions
    const overlapsPrev = idx > 0 && captionsOverlap(cap, captions[idx - 1]);
    const overlapsNext = idx < captions.length - 1 && captionsOverlap(cap, captions[idx + 1]);
    if (overlapsPrev || overlapsNext) {
      row.classList.add("overlap");
      const warning = document.createElement("div");
      warning.className = "overlapWarning";
      warning.textContent = "⚠ Overlapping time with adjacent caption";
      row.appendChild(warning);
    }

    // Top row: times + play/delete
    const top = document.createElement("div");
    top.className = "row-top";

    const startInput = document.createElement("input");
    startInput.type = "text";
    startInput.className = "timeField";
    startInput.value = formatTime(cap.start);
    startInput.addEventListener("change", () => {
      const v = parseTime(startInput.value);
      if (v !== null) cap.start = v;
      renderCaptionList();
    });

    const arrow = document.createElement("span");
    arrow.textContent = "→";
    arrow.style.fontSize = "12px";
    arrow.style.color = "#999";

    const endInput = document.createElement("input");
    endInput.type = "text";
    endInput.className = "timeField";
    endInput.value = formatTime(cap.end);
    endInput.addEventListener("change", () => {
      const v = parseTime(endInput.value);
      if (v !== null) cap.end = v;
      renderCaptionList();
    });

    const playBtn = document.createElement("button");
    playBtn.textContent = "▶ Play";
    playBtn.addEventListener("click", () => {
      videoPreview.currentTime = cap.start;
      videoPreview.play();
    });

    const deleteBtn = document.createElement("button");
    deleteBtn.textContent = "✕ Delete";
    deleteBtn.addEventListener("click", () => {
      captions = captions.filter(c => c.id !== cap.id);
      renderCaptionList();
    });

    top.appendChild(startInput);
    top.appendChild(arrow);
    top.appendChild(endInput);
    top.appendChild(playBtn);
    top.appendChild(deleteBtn);

    // Text field (full width)
    const textField = document.createElement("textarea");
    textField.className = "textField";
    textField.value = cap.text;

    const trackCursor = () => { cap._cursorPos = textField.selectionStart; };
    textField.addEventListener("click", trackCursor);
    textField.addEventListener("keyup", trackCursor);
    textField.addEventListener("focus", trackCursor);

    textField.addEventListener("input", () => {
      cap.text = textField.value;
      updateCharCount(charCountEl, cap.text);
    });

    const charCountEl = document.createElement("span");
    charCountEl.className = "charCount";
    updateCharCount(charCountEl, cap.text);

    // Action buttons: trim start/end, merge, split
    const actions = document.createElement("div");
    actions.className = "row-actions";

    const setStartBtn = document.createElement("button");
    setStartBtn.textContent = "⏱ Set Start = Playhead";
    setStartBtn.addEventListener("click", () => {
      cap.start = videoPreview.currentTime;
      renderCaptionList();
    });

    const setEndBtn = document.createElement("button");
    setEndBtn.textContent = "⏱ Set End = Playhead";
    setEndBtn.addEventListener("click", () => {
      cap.end = videoPreview.currentTime;
      renderCaptionList();
    });

    const mergeNextBtn = document.createElement("button");
    mergeNextBtn.textContent = "⬇ Merge with Next";
    mergeNextBtn.disabled = idx === captions.length - 1;
    mergeNextBtn.addEventListener("click", () => {
      const nextCap = captions[idx + 1];
      if (!nextCap) return;
      cap.text = cap.text.trim() + " " + nextCap.text.trim();
      cap.end = nextCap.end;
      captions = captions.filter(c => c.id !== nextCap.id);
      renderCaptionList();
    });

    const splitBtn = document.createElement("button");
    splitBtn.textContent = "✂ Split at Cursor";
    splitBtn.title = "Click inside the text box to place your cursor, then click this button to split there.";
    splitBtn.addEventListener("click", () => {
      const text = cap.text;
      let pos = cap._cursorPos;

      if (pos === null || pos === undefined || pos <= 0 || pos >= text.length) {
        alert("Click inside the caption text to place your cursor where you want to split, then try again.");
        return;
      }

      const firstText = text.slice(0, pos).trim();
      const secondText = text.slice(pos).trim();

      if (!firstText || !secondText) {
        alert("Cursor position doesn't leave text on both sides. Adjust and try again.");
        return;
      }

      const duration = cap.end - cap.start;
      const ratio = pos / text.length;
      const splitTime = cap.start + duration * ratio;

      const newCap = {
        id: crypto.randomUUID(),
        start: splitTime,
        end: cap.end,
        text: secondText,
        _cursorPos: null,
      };
      cap.text = firstText;
      cap.end = splitTime;
      cap._cursorPos = null;

      captions.splice(idx + 1, 0, newCap);
      renderCaptionList();
    });

    actions.appendChild(setStartBtn);
    actions.appendChild(setEndBtn);
    actions.appendChild(mergeNextBtn);
    actions.appendChild(splitBtn);

    row.appendChild(top);
    row.appendChild(textField);
    row.appendChild(charCountEl);
    row.appendChild(actions);
    captionList.appendChild(row);
  });
}

function updateCharCount(el, text) {
  el.textContent = `${text.length} characters`;
  el.className = text.length > CHAR_LIMIT ? "charCount over" : "charCount";
}

addRowBtn.addEventListener("click", () => {
  const last = captions[captions.length - 1];
  const start = last ? last.end : 0;
  captions.push({ id: crypto.randomUUID(), start, end: start + 2, text: "New caption", _cursorPos: null });
  renderCaptionList();
});

// Live caption overlay sync
videoPreview.addEventListener("timeupdate", () => {
  const t = videoPreview.currentTime;
  const active = captions.find(c => t >= c.start && t <= c.end);
  captionOverlay.textContent = active ? active.text : "";
});

// ---------- Export ----------
function secToSRTTime(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = Math.floor(sec % 60);
  const ms = Math.round((sec - Math.floor(sec)) * 1000);
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")},${String(ms).padStart(3,"0")}`;
}

function secToVTTTime(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = Math.floor(sec % 60);
  const ms = Math.round((sec - Math.floor(sec)) * 1000);
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}.${String(ms).padStart(3,"0")}`;
}

function downloadFile(filename, content) {
  const blob = new Blob([content], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

exportSrtBtn.addEventListener("click", () => {
  if (captions.length === 0) { alert("No captions to export."); return; }
  let out = "";
  captions.forEach((c, idx) => {
    out += `${idx + 1}\n${secToSRTTime(c.start)} --> ${secToSRTTime(c.end)}\n${c.text}\n\n`;
  });
  downloadFile("captions.srt", out);
});

exportVttBtn.addEventListener("click", () => {
  if (captions.length === 0) { alert("No captions to export."); return; }
  let out = "WEBVTT\n\n";
  captions.forEach((c) => {
    out += `${secToVTTTime(c.start)} --> ${secToVTTTime(c.end)}\n${c.text}\n\n`;
  });
  downloadFile("captions.vtt", out);
});
</script>
